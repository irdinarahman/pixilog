<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pixilog — diary</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1220">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pixilog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-deep: #2a1220; --bg-panel: #35182a; --bg-panel-2: #401d33;
    --lilac: #b57aa9; --lilac-soft: #dcb3d3; --mint: #f2c9d9; --mint-soft: #f9e3ec;
    --butter: #ef4f68; --butter-soft: #f7a3b0; --chrome: #f3e6ee; --chrome-dim: #b98fac;
    --cloud: #f8eef4; --ink: #2a1220; --line: rgba(243,230,238,0.16);
    --tint-rgb: 243,230,238; --dock-glass-rgb: 42,18,32;
    --glow-1: rgba(181,122,169,0.22); --glow-2: rgba(239,79,104,0.16);
    --pill-bg: #f8eef4; --pill-text: #2a1220;
  }
  [data-theme="light"]{
    --bg-deep: #fbf3f7; --bg-panel: #ffffff; --bg-panel-2: #f7e9f1;
    --lilac: #9a5c8e; --lilac-soft: #e6cee0; --mint: #c9788f; --mint-soft: #f3d9e2;
    --butter: #a30e2b; --butter-soft: #f0c3cb; --chrome: #4a2a40; --chrome-dim: #8a6b80;
    --cloud: #2a1220; --ink: #2a1220; --line: rgba(74,42,64,0.12);
    --tint-rgb: 74,42,64; --dock-glass-rgb: 255,255,255;
    --glow-1: rgba(154,92,142,0.12); --glow-2: rgba(163,14,43,0.08);
    --pill-bg: #2a1220; --pill-text: #fbf3f7;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 900px 500px at 12% -10%, var(--glow-1), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 0%, var(--glow-2), transparent 55%), var(--bg-deep);
    color: var(--cloud); font-family:'Space Grotesk', sans-serif; min-height:100vh; padding-bottom:60px;
  }
  h1,h2,h3{ font-family:'Fredoka', sans-serif; font-weight:600; }
  .dock{ display:flex; align-items:center; justify-content:space-between; padding:18px 28px;
    border-bottom:1px solid var(--line); position:sticky; top:0;
    background:rgba(var(--dock-glass-rgb),0.6); backdrop-filter:blur(6px); z-index:20; }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:34px; height:34px; border-radius:10px; overflow:hidden; }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; }
  .brand-name{ font-family:'Fredoka',sans-serif; font-size:1.15rem; color:var(--cloud); }
  .brand-name .dot{ color: var(--mint); }
  .dock-nav{ display:flex; gap:6px; background: rgba(var(--tint-rgb),0.04); padding:5px; border-radius:999px; border:1px solid var(--line); }
  .dock-nav a{ text-decoration:none; color:var(--chrome-dim); font-size:0.85rem; padding:8px 16px; border-radius:999px; transition:color .2s ease, background .2s ease; }
  .dock-nav a.active{ background:var(--pill-bg); color:var(--pill-text); font-weight:600; }
  .dock-nav a:not(.active):hover{ color:var(--cloud); }
  @media (max-width:720px){ .dock-nav{ display:none; } }
  .theme-toggle{ all:unset; cursor:pointer; width:44px; height:26px; border-radius:999px;
    background: rgba(var(--tint-rgb),0.08); border:1px solid var(--line); position:relative; }
  .theme-toggle .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:linear-gradient(135deg,var(--lilac),var(--mint)); display:flex; align-items:center; justify-content:center;
    font-size:0.7rem; transition:transform .25s ease; }
  [data-theme="light"] .theme-toggle .knob{ transform:translateX(18px); }
  .wrap{ max-width:640px; margin:0 auto; padding:36px 24px 0; }
  .day-card{ background: linear-gradient(165deg, var(--bg-panel-2), var(--bg-panel)); border:1px solid var(--line);
    border-radius:24px; padding:22px; margin-bottom:16px; }
  .day-card h3{ font-size:1rem; margin-bottom:14px; }
  .entry-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-bottom:1px dashed var(--line); font-size:0.86rem; }
  .entry-row:last-child{ border-bottom:none; }
  .entry-icon{ font-size:1.1rem; flex-shrink:0; width:22px; text-align:center; }
  .entry-body{ flex:1; }
  .entry-time{ color:var(--chrome-dim); font-size:0.74rem; }
  .entry-sub{ color:var(--chrome-dim); font-size:0.78rem; margin-top:2px; }
  .habit-pills{ display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
  .habit-pills span{ background:rgba(var(--tint-rgb),0.08); border-radius:999px; padding:3px 10px; font-size:0.74rem; }
  .empty-note{ color:var(--chrome-dim); font-size:0.85rem; text-align:center; padding:24px 0; }
  .mobile-dock{ display:none; }
  @media (max-width:720px){
    .mobile-dock{ display:flex; justify-content:space-around; align-items:center; position:fixed;
      bottom:14px; left:16px; right:16px; background:rgba(var(--dock-glass-rgb),0.85); backdrop-filter:blur(10px);
      border:1px solid var(--line); border-radius:999px; padding:10px 14px; z-index:30; }
    .mobile-dock a{ color:var(--chrome-dim); text-decoration:none; display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:0.62rem; }
    .mobile-dock a.active{ color:var(--cloud); }
    .mobile-dock svg{ width:18px; height:18px; }
  }
</style>
</head>
<body>
  <header class="dock">
    <a href="index.html" class="brand">
      <div class="brand-mark"><img src="icons/icon-192.png" alt="pixilog"></div>
      <div class="brand-name">pixi<span class="dot">log</span></div>
    </a>
    <nav class="dock-nav">
      <a href="index.html">home</a>
      <a href="mood.html">mood</a>
      <a href="expenses.html">expenses</a>
      <a href="habits.html">habits</a>
      <a href="sleep.html">sleep</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme"><span class="knob">🌙</span></button>
  </header>

  <nav class="mobile-dock">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V20H4V11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>home</span></a>
    <a href="mood.html"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/></svg><span>mood</span></a>
    <a href="expenses.html"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/></svg><span>spend</span></a>
    <a href="habits.html"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>habits</span></a>
    <a href="sleep.html"><svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6"/></svg><span>sleep</span></a>
  </nav>

  <main class="wrap">
    <h2 style="margin:24px 0;">your full diary</h2>
    <div id="diaryList"><p class="empty-note">loading...</p></div>
  </main>

  <script>
    const SUPABASE_URL = "https://pyxmuzudgzfvvkbipjln.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5eG11enVkZ3pmdnZrYmlwamxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzgyNDEsImV4cCI6MjEwNDMxNDI0MX0.Ki5MdbzAIxbgXizf1Ao-73Q5FIGfNegPfkQmHwxmbF4";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    function localDateStr(d) {
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    const moodEmoji = { 1: '😞', 2: '😕', 3: '🙂', 4: '😄', 5: '🤩' };

    function formatDateLabel(dateStr) {
      const today = localDateStr(new Date());
      const y = new Date(); y.setDate(y.getDate() - 1);
      if (dateStr === today) return 'today';
      if (dateStr === localDateStr(y)) return 'yesterday';
      return new Date(dateStr + 'T00:00:00').toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' });
    }

    async function loadDiary(userId) {
      const daysBack = 30;
      const since = new Date(); since.setDate(since.getDate() - daysBack); since.setHours(0, 0, 0, 0);
      const sinceDateStr = localDateStr(since);

      const [{ data: moods }, { data: sleeps }, { data: expenses }, { data: userHabits }] = await Promise.all([
        sb.from('mood_entries').select('*').eq('user_id', userId).gte('logged_at', since.toISOString()),
        sb.from('sleep_entries').select('*').eq('user_id', userId).gte('logged_date', sinceDateStr),
        sb.from('expense_entries').select('*').eq('user_id', userId).gte('logged_at', since.toISOString()),
        sb.from('habits').select('id, label, icon').eq('user_id', userId),
      ]);

      const habitMap = {};
      (userHabits || []).forEach(h => { habitMap[h.id] = h; });
      const habitIds = (userHabits || []).map(h => h.id);
      let habitLogs = [];
      if (habitIds.length) {
        const { data } = await sb.from('habit_logs').select('*').in('habit_id', habitIds).eq('done', true).gte('logged_date', sinceDateStr);
        habitLogs = data || [];
      }

      const byDate = {};
      function ensureDay(d) { if (!byDate[d]) byDate[d] = { mood: [], sleep: null, expenses: [], habits: [] }; return byDate[d]; }

      (moods || []).forEach(m => ensureDay(localDateStr(new Date(m.logged_at))).mood.push(m));
      (sleeps || []).forEach(s => { ensureDay(s.logged_date).sleep = s; });
      (expenses || []).forEach(e => ensureDay(localDateStr(new Date(e.logged_at))).expenses.push(e));
      habitLogs.forEach(l => { const h = habitMap[l.habit_id]; if (h) ensureDay(l.logged_date).habits.push(h); });

      const sortedDates = Object.keys(byDate).sort().reverse();
      const container = document.getElementById('diaryList');

      if (!sortedDates.length) {
        container.innerHTML = '<p class="empty-note">nothing logged yet — start with a mood check-in or a habit ✨</p>';
        return;
      }

      container.innerHTML = sortedDates.map(dateStr => {
        const day = byDate[dateStr];
        let rows = '';

        day.mood.sort((a, b) => new Date(b.logged_at) - new Date(a.logged_at)).forEach(m => {
          const time = new Date(m.logged_at).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
          rows += `<div class="entry-row">
            <div class="entry-icon">${moodEmoji[m.mood_score] || '🙂'}</div>
            <div class="entry-body">mood: ${m.note || ''} <span class="entry-time">· ${time}</span>
              ${m.song_tag ? `<div class="entry-sub">🎵 ${m.song_tag}</div>` : ''}
            </div>
          </div>`;
        });

        if (day.sleep) {
          const s = day.sleep;
          let durText = '–';
          if (s.bedtime && s.wake_time) {
            const [bh, bm] = s.bedtime.slice(0,5).split(':').map(Number);
            const [wh, wm] = s.wake_time.slice(0,5).split(':').map(Number);
            let mins = (wh*60+wm) - (bh*60+bm); if (mins <= 0) mins += 24*60;
            durText = `${Math.floor(mins/60)}h ${mins%60}m`;
          }
          rows += `<div class="entry-row">
            <div class="entry-icon">🌙</div>
            <div class="entry-body">sleep: ${durText} <span class="entry-sub">${s.bedtime ? s.bedtime.slice(0,5) : '–'} → ${s.wake_time ? s.wake_time.slice(0,5) : '–'}</span></div>
          </div>`;
        }

        if (day.expenses.length) {
          const total = day.expenses.reduce((s, e) => s + Number(e.amount), 0);
          const list = day.expenses.map(e => `${e.category}${e.note ? ' (' + e.note + ')' : ''} — RM${Number(e.amount).toFixed(2)}`).join(', ');
          rows += `<div class="entry-row">
            <div class="entry-icon">💸</div>
            <div class="entry-body">spent RM${total.toFixed(2)} <div class="entry-sub">${list}</div></div>
          </div>`;
        }

        if (day.habits.length) {
          rows += `<div class="entry-row">
            <div class="entry-icon">✓</div>
            <div class="entry-body">habits done
              <div class="habit-pills">${day.habits.map(h => `<span>${h.icon} ${h.label}</span>`).join('')}</div>
            </div>
          </div>`;
        }

        return `<div class="day-card"><h3>${formatDateLabel(dateStr)}</h3>${rows}</div>`;
      }).join('');
    }

    async function init() {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = 'index.html'; return; }
      await loadDiary(session.user.id);
    }
    init();

    const themeToggle = document.getElementById('themeToggle');
    const themeKnob = themeToggle.querySelector('.knob');
    const savedTheme = localStorage.getItem('pixilog-theme');
    if (savedTheme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); themeKnob.textContent = '☀️'; }
    themeToggle.addEventListener('click', () => {
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if (isLight) { document.documentElement.removeAttribute('data-theme'); themeKnob.textContent = '🌙'; localStorage.setItem('pixilog-theme','dark'); }
      else { document.documentElement.setAttribute('data-theme', 'light'); themeKnob.textContent = '☀️'; localStorage.setItem('pixilog-theme','light'); }
    });

    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  </script>
</body>
</html>
