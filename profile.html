<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>pixilog — profile</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a1220">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="pixilog">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg-deep: #2a1220;
    --bg-panel: #35182a;
    --bg-panel-2: #401d33;
    --lilac: #b57aa9;
    --lilac-soft: #dcb3d3;
    --mint: #f2c9d9;
    --mint-soft: #f9e3ec;
    --butter: #ef4f68;
    --butter-soft: #f7a3b0;
    --chrome: #f3e6ee;
    --chrome-dim: #b98fac;
    --cloud: #f8eef4;
    --ink: #2a1220;
    --line: rgba(243,230,238,0.16);
    --tint-rgb: 243,230,238;
    --dock-glass-rgb: 42,18,32;
    --glow-1: rgba(181,122,169,0.22);
    --glow-2: rgba(239,79,104,0.16);
    --pill-bg: #f8eef4;
    --pill-text: #2a1220;
    --danger: #ff8fa3;
  }
  [data-theme="light"]{
    --bg-deep: #fbf3f7;
    --bg-panel: #ffffff;
    --bg-panel-2: #f7e9f1;
    --lilac: #9a5c8e;
    --lilac-soft: #e6cee0;
    --mint: #c9788f;
    --mint-soft: #f3d9e2;
    --butter: #a30e2b;
    --butter-soft: #f0c3cb;
    --chrome: #4a2a40;
    --chrome-dim: #8a6b80;
    --cloud: #2a1220;
    --ink: #2a1220;
    --line: rgba(74,42,64,0.12);
    --tint-rgb: 74,42,64;
    --dock-glass-rgb: 255,255,255;
    --glow-1: rgba(154,92,142,0.12);
    --glow-2: rgba(163,14,43,0.08);
    --pill-bg: #2a1220;
    --pill-text: #fbf3f7;
    --danger: #c23b54;
  }

  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background: radial-gradient(ellipse 900px 500px at 12% -10%, var(--glow-1), transparent 60%),
                radial-gradient(ellipse 700px 500px at 100% 0%, var(--glow-2), transparent 55%),
                var(--bg-deep);
    color: var(--cloud);
    font-family:'Space Grotesk', sans-serif;
    min-height:100vh;
    padding-bottom:60px;
    transition: background-color .25s ease, color .25s ease;
  }
  h1,h2,h3{ font-family:'Fredoka', sans-serif; font-weight:600; }

  .dock{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 28px; border-bottom:1px solid var(--line);
    position:sticky; top:0; background:rgba(var(--dock-glass-rgb),0.6); backdrop-filter:blur(6px); z-index:20;
  }
  .brand{ display:flex; align-items:center; gap:10px; text-decoration:none; }
  .brand-mark{ width:34px; height:34px; border-radius:10px; overflow:hidden; box-shadow: inset 0 0 0 2px rgba(var(--tint-rgb),0.5); }
  .brand-mark img{ width:100%; height:100%; object-fit:cover; }
  .brand-name{ font-family:'Fredoka',sans-serif; font-size:1.15rem; color:var(--cloud); }
  .brand-name .dot{ color: var(--mint); }

  .dock-nav{ display:flex; gap:6px; background: rgba(var(--tint-rgb),0.04); padding:5px; border-radius:999px; border:1px solid var(--line); }
  .dock-nav a{ text-decoration:none; color:var(--chrome-dim); font-size:0.85rem; padding:8px 16px; border-radius:999px; transition:color .2s ease, background .2s ease; }
  .dock-nav a.active{ background:var(--pill-bg); color:var(--pill-text); font-weight:600; }
  .dock-nav a:not(.active):hover{ color:var(--cloud); }
  @media (max-width:720px){ .dock-nav{ display:none; } }

  .theme-toggle{
    all:unset; cursor:pointer; width:44px; height:26px; border-radius:999px;
    background: rgba(var(--tint-rgb),0.08); border:1px solid var(--line); position:relative;
  }
  .theme-toggle .knob{
    position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%;
    background:linear-gradient(135deg,var(--lilac),var(--mint));
    display:flex; align-items:center; justify-content:center; font-size:0.7rem;
    transition:transform .25s cubic-bezier(.4,0,.2,1);
  }
  [data-theme="light"] .theme-toggle .knob{ transform:translateX(18px); }

  .wrap{ max-width:560px; margin:0 auto; padding:36px 24px 0; }

  .card{
    background: linear-gradient(165deg, var(--bg-panel-2), var(--bg-panel));
    border:1px solid var(--line); border-radius:24px; padding:24px; margin-bottom:20px; position:relative;
  }
  .card h3{ font-size:1rem; margin-bottom:16px; color:var(--cloud); }

  .avatar-preview{
    width:88px; height:88px; border-radius:50%; margin:0 auto 18px;
    display:flex; align-items:center; justify-content:center; font-size:2.4rem;
    background:linear-gradient(135deg, var(--lilac), var(--mint));
    border:3px solid rgba(var(--tint-rgb),0.5);
  }
  .avatar-grid{ display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .avatar-grid button{
    all:unset; cursor:pointer; width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center; font-size:1.3rem;
    background:rgba(var(--tint-rgb),0.06); border:1.5px solid transparent;
  }
  .avatar-grid button.selected{ border-color:var(--mint); background:rgba(var(--tint-rgb),0.14); }

  label.field-label{ display:block; font-size:0.78rem; color:var(--chrome-dim); margin-bottom:6px; }
  input.text-input{
    width:100%; padding:12px 16px; border-radius:14px; border:1px solid var(--line);
    background:var(--bg-panel); color:var(--cloud); font-family:'Space Grotesk',sans-serif; font-size:0.9rem; outline:none;
  }
  input.text-input:disabled{ opacity:0.6; }
  .field{ margin-bottom:16px; }

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0; border-bottom:1px dashed var(--line);
  }
  .toggle-row:last-child{ border-bottom:none; }
  .toggle-row span{ font-size:0.88rem; }

  .switch{ all:unset; cursor:pointer; width:44px; height:26px; border-radius:999px; background:rgba(var(--tint-rgb),0.1); border:1px solid var(--line); position:relative; flex-shrink:0; }
  .switch .knob{ position:absolute; top:2px; left:2px; width:20px; height:20px; border-radius:50%; background:rgba(var(--tint-rgb),0.35); transition:transform .2s ease, background .2s ease; }
  .switch.on{ background:linear-gradient(135deg,var(--lilac),var(--mint)); }
  .switch.on .knob{ transform:translateX(18px); background:var(--ink); }

  .btn-primary{
    width:100%; padding:14px; border:none; border-radius:999px; cursor:pointer;
    background:linear-gradient(135deg,var(--lilac),var(--mint)); color:var(--ink);
    font-family:'Fredoka',sans-serif; font-weight:600; font-size:0.95rem; margin-top:6px;
  }
  .btn-danger{
    width:100%; padding:13px; border:1px solid var(--line); border-radius:999px; cursor:pointer;
    background:transparent; color:var(--danger); font-family:'Space Grotesk',sans-serif; font-size:0.88rem;
  }
  .save-status{ text-align:center; font-size:0.78rem; color:var(--chrome-dim); margin-top:10px; min-height:1em; }
  .mobile-dock{ display:none; }
  @media (max-width:720px){
    .mobile-dock{ display:flex; justify-content:space-around; align-items:center; position:fixed;
      bottom:14px; left:16px; right:16px; background:rgba(var(--dock-glass-rgb),0.85); backdrop-filter:blur(10px);
      border:1px solid var(--line); border-radius:999px; padding:10px 14px; z-index:30; }
    .mobile-dock a{ color:var(--chrome-dim); text-decoration:none; display:flex; flex-direction:column;
      align-items:center; gap:3px; font-size:0.62rem; }
    .mobile-dock a.active{ color:var(--cloud); }
    .mobile-dock svg{ width:18px; height:18px; }
  }
</style>
</head>
<body>

  <header class="dock">
    <a href="index.html" class="brand">
      <div class="brand-mark"><img src="icons/icon-192.png" alt="pixilog"></div>
      <div class="brand-name">pixi<span class="dot">log</span></div>
    </a>
    <nav class="dock-nav">
      <a href="index.html">home</a>
      <a href="mood.html">mood</a>
      <a href="expenses.html">expenses</a>
      <a href="habits.html">habits</a>
      <a href="sleep.html">sleep</a>
    </nav>
    <button class="theme-toggle" id="themeToggle" aria-label="Toggle light and dark mode">
      <span class="knob">🌙</span>
    </button>
  </header>

  <nav class="mobile-dock">
    <a href="index.html"><svg viewBox="0 0 24 24" fill="none"><path d="M4 11L12 4L20 11V20H4V11Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><span>home</span></a>
    <a href="mood.html"><svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8" stroke="currentColor" stroke-width="1.6"/></svg><span>mood</span></a>
    <a href="expenses.html"><svg viewBox="0 0 24 24" fill="none"><rect x="3" y="7" width="18" height="12" rx="2" stroke="currentColor" stroke-width="1.6"/></svg><span>spend</span></a>
    <a href="habits.html"><svg viewBox="0 0 24 24" fill="none"><path d="M4 12L9 17L20 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg><span>habits</span></a>
    <a href="sleep.html"><svg viewBox="0 0 24 24" fill="none"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.3 6.3 0 0 0 10.5 10.5Z" stroke="currentColor" stroke-width="1.6"/></svg><span>sleep</span></a>
  </nav>

  <main class="wrap">
    <h2 style="margin-bottom:24px;">your profile</h2>

    <div class="card" style="text-align:center;">
      <div class="avatar-preview" id="avatarPreview">🌙</div>
      <h3 style="margin-bottom:12px;">pick your sticker</h3>
      <div class="avatar-grid" id="avatarGrid">
        <button data-emoji="🌙">🌙</button>
        <button data-emoji="⭐">⭐</button>
        <button data-emoji="💿">💿</button>
        <button data-emoji="👾">👾</button>
        <button data-emoji="🍡">🍡</button>
        <button data-emoji="🌈">🌈</button>
        <button data-emoji="⚡">⚡</button>
        <button data-emoji="🍥">🍥</button>
      </div>
    </div>

    <div class="card">
      <h3>account</h3>
      <div class="field">
        <label class="field-label">display name</label>
        <input type="text" class="text-input" id="displayName" placeholder="what should we call you?">
      </div>
      <div class="field" style="margin-bottom:0;">
        <label class="field-label">email</label>
        <input type="text" class="text-input" id="userEmail" disabled>
      </div>
    </div>

    <div class="card">
      <h3>reminders</h3>
      <div class="toggle-row">
        <span>mood check-in</span>
        <button class="switch" data-key="notify_mood"><span class="knob"></span></button>
      </div>
      <div class="toggle-row">
        <span>sleep log</span>
        <button class="switch" data-key="notify_sleep"><span class="knob"></span></button>
      </div>
      <div class="toggle-row">
        <span>expense log</span>
        <button class="switch" data-key="notify_expense"><span class="knob"></span></button>
      </div>
      <div class="toggle-row">
        <span>habit check-in</span>
        <button class="switch" data-key="notify_habit"><span class="knob"></span></button>
      </div>
    </div>

    <button class="btn-primary" id="saveBtn">save changes</button>
    <p class="save-status" id="saveStatus"></p>

    <div class="card">
      <button class="btn-danger" id="signOutBtn">sign out</button>
    </div>
  </main>

  <script>
    const SUPABASE_URL = "https://pyxmuzudgzfvvkbipjln.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InB5eG11enVkZ3pmdnZrYmlwamxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg3MzgyNDEsImV4cCI6MjEwNDMxNDI0MX0.Ki5MdbzAIxbgXizf1Ao-73Q5FIGfNegPfkQmHwxmbF4";
    const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;
    let profileState = { display_name: '', avatar_emoji: '🌙', notify_mood: true, notify_sleep: true, notify_expense: false, notify_habit: true };

    const avatarPreview = document.getElementById('avatarPreview');
    const avatarGrid = document.getElementById('avatarGrid');
    const displayNameInput = document.getElementById('displayName');
    const userEmailInput = document.getElementById('userEmail');
    const saveBtn = document.getElementById('saveBtn');
    const saveStatus = document.getElementById('saveStatus');
    const signOutBtn = document.getElementById('signOutBtn');

    function renderAvatarGrid(){
      avatarGrid.querySelectorAll('button').forEach(b=>{
        b.classList.toggle('selected', b.dataset.emoji === profileState.avatar_emoji);
      });
      avatarPreview.textContent = profileState.avatar_emoji;
    }
    function renderToggles(){
      document.querySelectorAll('.switch').forEach(sw=>{
        const on = !!profileState[sw.dataset.key];
        sw.classList.toggle('on', on);
      });
    }

    avatarGrid.addEventListener('click', (e)=>{
      const btn = e.target.closest('button');
      if(!btn) return;
      profileState.avatar_emoji = btn.dataset.emoji;
      renderAvatarGrid();
    });

    document.querySelectorAll('.switch').forEach(sw=>{
      sw.addEventListener('click', ()=>{
        profileState[sw.dataset.key] = !profileState[sw.dataset.key];
        renderToggles();
      });
    });

    async function loadProfile(){
      const { data: { session } } = await sb.auth.getSession();
      if(!session){ window.location.href = 'index.html'; return; }
      currentUserId = session.user.id;
      userEmailInput.value = session.user.email;

      const { data, error } = await sb.from('profiles').select('*').eq('id', currentUserId).single();
      if(data){
        profileState = { ...profileState, ...data };
      }
      displayNameInput.value = profileState.display_name || '';
      renderAvatarGrid();
      renderToggles();
    }

    // ---- push notifications ----
    // 1. generate your own pair with: npx web-push generate-vapid-keys
    // 2. paste the PUBLIC key here (the private key goes only in the Edge Function, never in client code)
    const VAPID_PUBLIC_KEY = "YOUR_VAPID_PUBLIC_KEY";

    function urlBase64ToUint8Array(base64String) {
      const padding = '='.repeat((4 - (base64String.length % 4)) % 4);
      const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
      const rawData = atob(base64);
      return Uint8Array.from([...rawData].map((c) => c.charCodeAt(0)));
    }

    async function ensurePushSubscription() {
      if (!('serviceWorker' in navigator) || !('PushManager' in window)) return;
      if (VAPID_PUBLIC_KEY.startsWith('YOUR_')) return; // not configured yet

      const permission = await Notification.requestPermission();
      if (permission !== 'granted') return;

      const registration = await navigator.serviceWorker.ready;
      let subscription = await registration.pushManager.getSubscription();
      if (!subscription) {
        subscription = await registration.pushManager.subscribe({
          userVisibleOnly: true,
          applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
        });
      }
      const json = subscription.toJSON();
      await sb.from('push_subscriptions').upsert({
        user_id: currentUserId,
        endpoint: json.endpoint,
        p256dh: json.keys.p256dh,
        auth_key: json.keys.auth
      }, { onConflict: 'user_id,endpoint' });
    }

    saveBtn.addEventListener('click', async ()=>{
      saveStatus.textContent = 'saving...';
      const payload = {
        id: currentUserId,
        display_name: displayNameInput.value.trim(),
        avatar_emoji: profileState.avatar_emoji,
        notify_mood: profileState.notify_mood,
        notify_sleep: profileState.notify_sleep,
        notify_expense: profileState.notify_expense,
        notify_habit: profileState.notify_habit,
        updated_at: new Date().toISOString()
      };
      const { error } = await sb.from('profiles').upsert(payload);
      saveStatus.textContent = error ? error.message : 'saved ✨';

      const anyReminderOn = profileState.notify_mood || profileState.notify_sleep || profileState.notify_expense || profileState.notify_habit;
      if (!error && anyReminderOn) {
        ensurePushSubscription().catch(() => {});
      }
    });

    signOutBtn.addEventListener('click', async ()=>{
      await sb.auth.signOut();
      window.location.href = 'index.html';
    });

    const themeToggle = document.getElementById('themeToggle');
    const themeKnob = themeToggle.querySelector('.knob');
    const savedTheme = localStorage.getItem('pixilog-theme');
    if (savedTheme === 'light') { document.documentElement.setAttribute('data-theme', 'light'); themeKnob.textContent = '☀️'; }
    themeToggle.addEventListener('click', ()=>{
      const isLight = document.documentElement.getAttribute('data-theme') === 'light';
      if(isLight){ document.documentElement.removeAttribute('data-theme'); themeKnob.textContent='🌙'; localStorage.setItem('pixilog-theme','dark'); }
      else{ document.documentElement.setAttribute('data-theme','light'); themeKnob.textContent='☀️'; localStorage.setItem('pixilog-theme','light'); }
    });

    loadProfile();

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
